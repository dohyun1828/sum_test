name: Fixed-price issue 100243 native validation
on:
  push:
    branches: [codex-fixed-bounty-102006-20260929]
    paths: ['.github/workflows/fixed-bounty-100243.yml', 'fixed-bounty-100243/**']
permissions:
  contents: read
concurrency:
  group: fixed-bounty-100243
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'dohyun1828/sum_test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.5.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Fetch pinned source and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/logs evidence/submission
          git init upstream
          git -C upstream remote add origin https://github.com/Expensify/App.git
          git -C upstream fetch --depth=1 origin 201a6e128b7f7a402920de36fc70244d23b206f2
          git -C upstream checkout --detach FETCH_HEAD
          git init candidate
          git -C candidate remote add origin https://github.com/dohyun1828/sum_test.git
          git -C candidate fetch --depth=1 origin "$GITHUB_SHA"
          git -C candidate checkout --detach FETCH_HEAD
          printf 'upstream=%s\ncandidate=%s\nnode=%s\nbun=%s\n' "$(git -C upstream rev-parse HEAD)" "$GITHUB_SHA" "$(node --version)" "$(bun --version)" > evidence/environment.txt
      - name: Install locked dependencies and reviewed setup
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          BUN_BIN="$(command -v bun)"
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee ../evidence/logs/install.log
          ln -sfn "$BUN_BIN" node_modules/.bin/bun
          STANDALONE_NEW_DOT=true npm run postinstall 2>&1 | tee ../evidence/logs/postinstall.log
      - name: Test original and candidate
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          export TZ=utc
          export NODE_OPTIONS='--experimental-vm-modules --max_old_space_size=8192'
          run_check() {
            local name="$1"; shift
            set +e
            timeout 600 "$@" > "../evidence/logs/$name.log" 2>&1
            local code=$?
            set -e
            tail -n 100 "../evidence/logs/$name.log"
            printf '%s\t%s\n' "$name" "$code" >> ../evidence/check-status.tsv
          }
          TEST_FILE=tests/ui/components/IOURequestStepConfirmationPageTest.tsx
          SOURCE_FILE=src/pages/iou/request/step/IOURequestStepConfirmation.tsx
          run_check baseline node node_modules/jest/bin/jest.js --runInBand --watch=false --forceExit --runTestsByPath "$TEST_FILE" tests/unit/NavigateGlobalCreateProviderTest.tsx tests/unit/shouldUseDefaultExpensePolicyTest.ts --json --outputFile=../evidence/baseline.json
          python3 ../candidate/fixed-bounty-100243/prepare.py . tests
          run_check red node node_modules/jest/bin/jest.js --runInBand --watch=false --forceExit --runTestsByPath "$TEST_FILE" --testNamePattern='Global-create route isolation' --json --outputFile=../evidence/red.json
          python3 ../candidate/fixed-bounty-100243/prepare.py . production
          run_check format bun node_modules/.bin/oxfmt --write "$SOURCE_FILE" "$TEST_FILE"
          run_check patched node node_modules/jest/bin/jest.js --runInBand --watch=false --forceExit --runTestsByPath "$TEST_FILE" tests/unit/NavigateGlobalCreateProviderTest.tsx tests/unit/shouldUseDefaultExpensePolicyTest.ts tests/ui/ScanSkipConfirmationTest.tsx tests/ui/IOURequestStepScanTest.tsx --json --outputFile=../evidence/patched.json
          run_check typecheck bun scripts/typecheck.ts
          run_check lint bun scripts/lint/index.ts "$SOURCE_FILE" "$TEST_FILE"
          git diff --check > ../evidence/logs/diff-check.log 2>&1
          git diff -- "$SOURCE_FILE" "$TEST_FILE" > ../evidence/submission/solution.patch
          cp "$SOURCE_FILE" ../evidence/submission/IOURequestStepConfirmation.tsx
          cp "$TEST_FILE" ../evidence/submission/IOURequestStepConfirmationPageTest.tsx
          cp LICENSE ../evidence/submission/LICENSE
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('../evidence')
          r=json.loads((root/'red.json').read_text())
          p=json.loads((root/'patched.json').read_text())
          checks=dict(line.split('\t') for line in (root/'check-status.tsv').read_text().splitlines())
          assert r['numFailedTests'] > 0 and r['numPassedTests'] > 0, 'No valid red/control contrast'
          assert p['success'] and p['numFailedTests']==0, 'Candidate tests not green'
          assert all(v=='0' for k,v in checks.items() if k!='red'), checks
          PY
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-bounty-100243-validation
          path: evidence/
          if-no-files-found: error
          retention-days: 14
